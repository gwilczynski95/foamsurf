name: foamsurf-release
channels:
  - nvidia/label/cuda-12.4.1
  - conda-forge
dependencies:
  - python=3.11
  - cuda-toolkit=12.4.1
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch==2.6.0+cu124
      - torchvision==0.21.0+cu124
      - numpy==1.26.4
      - setuptools==80.9.0
      - ninja==1.13.0
      - pytest==9.1.1
      - -r requirements.txt
