[metadata]
name = foamsurf-topology
description = CUDA Delaunay topology component for FoamSurf
long_description = file: README.md
long_description_content_type = text/markdown
author = FoamSurf contributors
license = Apache-2.0
platforms = linux
url = https://github.com/gwilczynski95/foamsurf
project_urls =
    Source = https://github.com/gwilczynski95/foamsurf
    Upstream topology = https://github.com/theialab/radfoam
keywords = neural rendering voronoi delaunay gaussian splatting
classifiers =

[options]
zip_safe = False
packages = find:
package_dir =
    =src
python_requires = >=3.10

[options.packages.find]
where = src
