experiment_name: stage1-gaussian-only
output_dir: outputs/stage1-gaussian-only
seed: 42
device: cuda
representation_mode: gaussian_only
background: [1.0, 1.0, 1.0]
dataset:
  source_path: /shared/sets/datasets/foamsurf/lego/lego_both
  gaussian_ground_truth_path: /shared/sets/datasets/foamsurf/lego/lego_lego
  medium_ground_truth_path: /shared/sets/datasets/foamsurf/lego/lego_clouds
  train_target: lego
  resolution: 1
  llffhold: 8
model:
  appearance: sh
  sh_degree: 3
  gaussian_initial_points: 100000
  gaussian_initial_opacity: 0.1
  gaussian_initial_kappa: 1.01
  medium_points: 32
  medium_guard_points: 0
renderer:
  near: 0.1
  far: 6.0
  training_transmittance_threshold: 0.0001
  validation_transmittance_threshold: 0.001
  max_intersections: 1024
  number_of_sides: 8
  gaussian_radius_squared: 11.3449
optimization:
  iterations: 30000
  rays_per_batch: 640000
  full_image_batch: true
  cameras_without_replacement: true
  reconstruction_loss: l1_dssim
  dssim_weight: 0.2
  gaussian_appearance_lr: 0.0025
  gaussian_appearance_rest_lr_scale: 0.05
  gaussian_opacity_lr: 0.025
  gaussian_kappa_lr: 0.1
  gaussian_means_lr: 0.00016
  gaussian_means_lr_final: 0.0000016
  gaussian_means_lr_max_steps: 30000
  gaussian_means_spatial_scale: true
  gaussian_scales_lr: 0.005
  gaussian_quaternions_lr: 0.001
  gaussian_adam_eps: 0.000000000000001
  gaussian_sh_degree_interval: 1000
validation:
  eval_interval: 1000
  log_interval: 10
  checkpoint_interval: 1000
  max_eval_views: -1
  image_views: 4
diagnostics:
  enabled: true
  save_per_primitive: true
gaussian_adaptation:
  enabled: true
  max_points: null
  densify_from: 500
  densify_until: 15000
  densification_interval: 100
  gradient_threshold: 0.0002
  min_opacity: 0.005
  opacity_prune_from: 500
  percent_dense: 0.01
  size_prune_from: 3000
  screen_pruning_enabled: false
  max_world_scale_fraction: 0.10
  opacity_reset_interval: 3000
  opacity_reset_value: 0.01
  opacity_reset_at_densify_from: true
voronoi_adaptation:
  enabled: false
wandb:
  mode: online
  project: foamsurf_stage1_gaussian
  name: stage1-gaussian-only
  tags: [stage1, gaussian-only, lego-lego, 2dgs]
