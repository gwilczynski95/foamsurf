output_dir: outputs/end_to_end_iui3/default
common:
  seed: 42
  background: [1, 1, 1]
  dataset:
    source_path: /shared/sets/datasets/SeathruNeRF_dataset/IUI3-RedSea-Undistorted
    resolution: 1
    llffhold: 8
    gaussian_ground_truth_path: null
    medium_ground_truth_path: null
    train_target: both
  model:
    medium_bbox_min: null
    medium_bbox_max: null
  renderer:
    near: 0.0
    far: 1000
  wandb:
    mode: offline
    project: foamsurf_iui3
warmup:
  config: end_to_end_warmup.yaml
  overrides:
    model:
      medium_points: 32  # bootstrap only; replaced by floor(.9*Ncolmap) before training
    voronoi_adaptation:
      densify_until: 11000
    voronoi_warmup:
      milestone_iterations: [0, 1000, 2000, 3000, 5000]
  profile:
    site_initialization: pcd
    ray_sampling: mixed
    population_policy: radfoam
    population_factor: 1.15
    population_target: 2097152
    population_horizon: 11000
    population_min_interval: 100
    error_map_downsample: 2
    error_map_chunk: 65536
    reset_low_contribution: true
    topology_schedule: radfoam
    density_beta: 10
    activation_scale: 1
    outer_points: 5000
    outer_scale: 10
    outer_positions_trainable: true
    outer_density_trainable: true
    outer_color_trainable: true
    loss: smooth_l1
    opacity_weight: 1
    quantile_weight: 0.0001
    quantile_ramp: 10000
    resolutions: [4, 2, 1]
    resolution_steps: [0, 150, 500]
joint:
  config: end_to_end_joint.yaml
  overrides: {}
partition:
  method: weighted_valley_w1_s2
  batch_size: 8192
  image_views: 4
handoff:
  gaussian_count: 100000
  pca_neighbors: 8
  reset_density: 1.0e-08
