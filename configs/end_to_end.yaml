output_dir: outputs/end_to_end/default
common:
  seed: 0
warmup:
  config: end_to_end_warmup.yaml
  profile:
    site_initialization: random
    ray_sampling: mixed
    population_policy: radfoam
    population_factor: 1.15
    population_target: 2097152
    population_horizon: 11000
    population_min_interval: 100
    error_map_downsample: 2
    error_map_chunk: 65536
    reset_low_contribution: true
    prune_contribution: 0.01
    reset_contribution: 0.001
    prune_radius: 0.1
    topology_schedule: radfoam
    density_beta: 10
    activation_scale: 1
    initial_sigma: 0.06931471805599453
    outer_points: 5000
    outer_scale: 10
    outer_sigma: 0.0006715348489118068
    outer_positions_trainable: true
    outer_density_trainable: true
    outer_color_trainable: true
    corner_guards: false
    loss: smooth_l1
    smooth_l1_beta: 1
    opacity_weight: 1
    schedule: cosine
    sites_lr: 0.0002
    sites_final: 5.0e-06
    sites_steps: 18000
    density_lr: 0.1
    density_final: 0.01
    density_warmup: 2000
    density_steps: 20000
    color_lr: 0.005
    color_final: 0.0005
    color_steps: 20000
    adam_eps: 1.0e-15
    resolutions:
    - 4
    - 2
    - 1
    resolution_steps:
    - 0
    - 150
    - 500
    quantile_weight: 0
    quantile_start: 0
    quantile_ramp: 10000
    quantile_end: null
    fixed_quantiles: null
  overrides: {}
joint:
  config: end_to_end_joint.yaml
  overrides: {}
partition:
  method: weighted_valley_w1_s2
  batch_size: 8192
  image_views: 4
handoff:
  gaussian_count: 100000
  pca_neighbors: 8
  reset_density: 1.0e-08
