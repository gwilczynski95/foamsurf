experiment_name: b01-lego
output_dir: outputs/b01-lego
seed: 42
device: cuda
background: [1.0, 1.0, 1.0]

dataset:
  source_path: /home/gmwilczn/nerf_synth_mipnerf/lego
  resolution: 1
  llffhold: 8

model:
  appearance: sh
  sh_degree: 3
  gaussian_initial_points: 100000
  gaussian_initial_opacity: 0.01
  gaussian_initial_kappa: 1.01

  # B0 medium: sparse, fixed-count, volume-distributed Voronoi sites.
  medium_points: 2048
  medium_guard_points: 8
  medium_guard_scale: 1.25
  medium_bbox_margin: 0.10
  medium_bbox_min: null
  medium_bbox_max: null
  medium_initial_density: 0.01
  medium_initial_color: [0.5, 0.5, 0.5]

renderer:
  near: 0.1
  far: 6.0
  training_transmittance_threshold: 0.0001
  validation_transmittance_threshold: 0.001
  max_intersections: 1024
  number_of_sides: 8
  gaussian_radius_squared: 11.3449

optimization:
  iterations: 35000
  rays_per_batch: 65536

  gaussian_appearance_lr: 0.005
  gaussian_opacity_lr: 0.05
  gaussian_kappa_lr: 0.1
  gaussian_means_lr: 0.0025
  gaussian_scales_lr: 0.0396538025
  gaussian_quaternions_lr: 0.01

  medium_sites_lr: 0.0001
  medium_density_lr: 0.01
  medium_color_lr: 0.005

  topology_update_interval: 25
  topology_incremental: true

validation:
  eval_interval: 1000
  log_interval: 10
  checkpoint_interval: 1000
  max_eval_views: -1
  image_views: 4

diagnostics:
  enabled: true
  save_per_primitive: true
  contribution_epsilon: 1.0e-6

wandb:
  mode: online
  project: foamsurf
  entity: null
  name: b01-lego
  tags: [B0.1, lego, hybrid, diagnostics, unregularized]
