experiment_name: b1-lego-layers
output_dir: outputs/b1-lego-layers
seed: 42
device: cuda
background: [1.0, 1.0, 1.0]

dataset:
  # Only this combined variant is sampled by the training loss.
  source_path: /shared/sets/datasets/foamsurf/lego/lego_both
  resolution: 1
  llffhold: 8

  # These camera-aligned variants are loaded on CPU, test split only, and are
  # used exclusively by validation diagnostics.
  gaussian_ground_truth_path: /shared/sets/datasets/foamsurf/lego/lego_lego
  medium_ground_truth_path: /shared/sets/datasets/foamsurf/lego/lego_clouds

model:
  appearance: sh
  sh_degree: 3
  gaussian_initial_points: 100000
  gaussian_initial_opacity: 0.1
  gaussian_initial_kappa: 1.01

  medium_points: 2048
  medium_guard_points: 8
  medium_guard_scale: 1.25
  medium_bbox_margin: 0.10
  medium_bbox_min: null
  medium_bbox_max: null
  medium_initial_density: 0.01
  medium_initial_color: [0.5, 0.5, 0.5]

renderer:
  near: 0.1
  far: 6.0
  training_transmittance_threshold: 0.0001
  validation_transmittance_threshold: 0.001
  max_intersections: 1024
  number_of_sides: 8
  gaussian_radius_squared: 11.3449

optimization:
  iterations: 35000
  rays_per_batch: 65536

  # GraphDECO 3DGS Gaussian optimizer. Kappa is FoamSurf-only.
  gaussian_appearance_lr: 0.0025
  gaussian_appearance_rest_lr_scale: 0.05
  gaussian_opacity_lr: 0.025
  gaussian_kappa_lr: 0.1
  gaussian_means_lr: 0.00016
  gaussian_means_lr_final: 0.0000016
  gaussian_means_lr_delay_steps: 0
  gaussian_means_lr_delay_mult: 0.01
  gaussian_means_lr_max_steps: 30000
  gaussian_means_spatial_scale: true
  gaussian_scales_lr: 0.005
  gaussian_quaternions_lr: 0.001
  gaussian_adam_eps: 0.000000000000001
  gaussian_sh_degree_interval: 1000

  medium_sites_lr: 0.0001
  medium_density_lr: 0.01
  medium_color_lr: 0.005

  topology_update_interval: 25
  topology_incremental: true

validation:
  eval_interval: 1000
  log_interval: 10
  checkpoint_interval: 1000
  max_eval_views: -1
  image_views: 4

diagnostics:
  enabled: true
  save_per_primitive: true
  contribution_epsilon: 1.0e-6
  layer_alpha_threshold: 0.01

gaussian_adaptation:
  enabled: true
  max_points: 200000
  densify_from: 500
  densify_until: 15000
  densification_interval: 100
  gradient_threshold: 0.0002
  min_opacity: 0.005
  opacity_prune_from: 500
  percent_dense: 0.01
  size_prune_from: 3000
  # Disabled by the 2DGS profile because pinned upstream resets max_radii2D
  # before its final pruning pass.
  screen_pruning_enabled: false
  max_screen_size: 20.0
  max_world_scale_fraction: 0.10

wandb:
  mode: online
  project: foamsurf
  entity: null
  name: b1-lego-layers
  tags: [B1, lego, layers, entanglement, gaussian-adaptation]
