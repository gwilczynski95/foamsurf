# Single causal test of RadFoam spatial initialization.  The optimization and
# Gaussian eviction schedule match Gaussian-eviction run 30; only the initial
# population is replaced by the separated iteration-4000 RadFoam prior.
experiment_name: radfoam-prior-run30
output_dir: outputs/radfoam_prior/run30
seed: 0
device: cuda
representation_mode: hybrid
background: [0.0, 0.0, 0.0]

dataset:
  source_path: /shared/sets/datasets/foamsurf/lego/lego_both
  resolution: 1
  llffhold: 8
  gaussian_ground_truth_path: /shared/sets/datasets/foamsurf/lego/lego_lego
  medium_ground_truth_path: /shared/sets/datasets/foamsurf/lego/lego_clouds
  train_target: both

model:
  appearance: rgb
  sh_degree: 3
  gaussian_initial_points: 100000
  gaussian_initial_opacity: 0.10
  gaussian_initial_kappa: 1.01
  gaussian_initial_scale_neighbors: 3
  # Exact number left after removing 211125 SURFACE cells from 371004 cells.
  medium_points: 159879
  medium_guard_points: 0
  medium_guard_scale: 1.25
  medium_bbox_margin: 0.10
  medium_bbox_min: [-1.5, -1.5, -1.5]
  medium_bbox_max: [1.5, 1.5, 1.5]
  medium_initial_density: 0.005
  medium_initial_color: [0.5, 0.5, 0.5]

radfoam_prior:
  enabled: true
  checkpoint_path: /shared/results/gmwilczn/foamsurf/radfoam/output/lego_both_prior_487402/checkpoints/iter_00004000.pt
  labels_path: /shared/results/gmwilczn/foamsurf/radfoam/output/lego_both_prior_487402/separation/iter_00004000/checkpoint_only/local_contrast_otsu/cell_labels.pt
  gaussian_count: 100000
  pca_neighbors: 8
  reset_density: 0.00000001

renderer:
  near: 0.1
  far: 1000.0
  training_transmittance_threshold: 0.0001
  validation_transmittance_threshold: 0.01
  max_intersections: 1024
  number_of_sides: 8
  gaussian_radius_squared: 11.3449
  gaussian_hit_buffer_size: 64

optimization:
  iterations: 30000
  rays_per_batch: 640000
  full_image_batch: true
  cameras_without_replacement: true
  reconstruction_loss: l1_dssim
  dssim_weight: 0.2
  gaussian_appearance_lr: 0.005
  gaussian_appearance_rest_lr_scale: 1.0
  gaussian_appearance_lr_decay: -0.000086643
  gaussian_appearance_lr_final: 0.001
  gaussian_opacity_lr: 0.05
  gaussian_opacity_lr_decay: -0.000086643
  gaussian_opacity_lr_final: 0.025
  gaussian_kappa_lr: 0.1
  gaussian_kappa_lr_decay: -0.000086643
  gaussian_kappa_lr_final: 0.1
  gaussian_means_lr: 0.0025
  gaussian_means_lr_decay: -0.00015
  gaussian_means_lr_final: 0.000001189614075
  gaussian_means_lr_delay_steps: 0
  gaussian_means_lr_delay_mult: 0.01
  gaussian_means_lr_max_steps: 35000
  gaussian_means_spatial_scale: false
  gaussian_scales_lr: 0.0396538025
  gaussian_scales_lr_decay: -0.000086643
  gaussian_scales_lr_final: 0.0396538025
  gaussian_quaternions_lr: 0.01
  gaussian_quaternions_lr_decay: -0.000086643
  gaussian_quaternions_lr_final: 0.001
  gaussian_adam_eps: 0.00000001
  gaussian_freeze_until: 0
  gaussian_sh_degree_interval: 0
  gaussian_scale_regularization: 0.001
  gaussian_min_scale: 0.0001
  gaussian_max_scale_fraction: 0.05
  medium_sites_lr: 0.00005
  medium_density_lr: 0.01
  medium_color_lr: 0.0025
  medium_sites_lr_final: 0.000005
  medium_density_lr_final: 0.001
  medium_color_lr_final: 0.0005
  medium_lr_decay_from: 15000
  medium_lr_decay_until: 30000
  topology_update_interval: 25
  topology_incremental: true

validation:
  eval_interval: 1000
  log_interval: 10
  checkpoint_interval: 1000
  max_eval_views: -1
  image_views: 4

diagnostics:
  enabled: true
  save_per_primitive: false
  contribution_epsilon: 0.000001
  layer_alpha_threshold: 0.01

disentanglement:
  opacity_binarization_weight: 0.0

medium_handoff:
  prefix_mode: none
  prefix_iterations: 0

gaussian_adaptation:
  enabled: true
  policy: graphdeco
  max_points: null
  runaway_max_points: null
  densify_from: 500
  densify_until: 15000
  densification_interval: 250
  gradient_threshold: 0.0004
  min_opacity: 0.20
  min_opacity_initial: 0.20
  opacity_prune_from: 3000
  opacity_prune_ramp: 0
  opacity_prune_ramp_shape: linear
  opacity_prune_until: 15000
  opacity_prune_interval: 250
  min_points: 1
  max_opacity_prune_fraction: 1.0
  percent_dense: 0.02
  size_prune_from: 3000
  screen_pruning_enabled: false
  max_screen_size: 20.0
  max_world_scale_fraction: 0.10
  opacity_reset_interval: 0
  opacity_reset_value: 0.01
  opacity_reset_at_densify_from: false
  opacity_reset_optimizer_state: true
  medium_freeze_after_reset: 0
  medium_freeze_interval: 0
  medium_freeze_from: 0
  medium_freeze_steps: 0
  preserve_clone_opacity: false
  preserve_split_opacity: false
  movement_threshold: 0.001
  min_effective_scale: 0.00001

# Population adaptation is intentionally disabled.  The 159879 retained cells
# are the learned spatial prior, not a temporary overcomplete initialization.
voronoi_adaptation:
  enabled: false
  densify_from: 1000
  densify_until: 20000
  interval: 500
  adaptation_offset: 0
  densify_fraction: 0.0
  max_points: null
  min_points: 159879
  min_visibility: 1.0
  contribution_threshold: 0.000001
  gradient_threshold: 0.0
  prune_cell_radius_fraction: 0.02
  max_prune_fraction: 0.0
  prune_patience: 2
  child_jitter_fraction: 0.0
  freeze_at_capacity: false

wandb:
  mode: online
  project: foamsurf_radfoam_prior
  name: radfoam-prior-run30
  tags: [radfoam-prior, spatial-initialization, run30, fixed-voronoi-population]
