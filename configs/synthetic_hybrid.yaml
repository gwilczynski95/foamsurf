# FoamSurf on the synthetic Blender scenes with the Voronoi-first initialization and the CURRENT joint stage:
#   1-3. warmup, partition and handoff exactly as configs/synthetic_voronoi.yaml (run 508222);
#   4. joint: configs/seathru.yaml (RGB medium, 1.5 x sigmoid SH colour, the surface-medium priors, medium smoothness,
#      opacity binarization, densification) without what only applies to real underwater captures: OceanSplat,
#      the camera model (PPISP; Blender cameras are ideal), the water phase and its extension, and the water-at-the-
#      cameras prior. The handoff turns the warmup's density into RGB attenuation = backscatter.
# Only the training photos are used; the layer ground-truth paths are for the evaluation only.
#   python train.py --config configs/synthetic_hybrid.yaml --scene $D/lego/lego_both --out outputs/lego_hybrid
output_dir: outputs/end_to_end/default
common:
  seed: 0
warmup:
  profile:
    site_initialization: random
    ray_sampling: mixed
    population_policy: radfoam
    population_factor: 1.15
    population_target: 2097152
    population_horizon: 11000
    population_min_interval: 100
    error_map_downsample: 2
    error_map_chunk: 65536
    reset_low_contribution: true
    prune_contribution: 0.01
    reset_contribution: 0.001
    prune_radius: 0.1
    topology_schedule: radfoam
    density_beta: 10
    activation_scale: 1
    initial_sigma: 0.06931471805599453
    outer_points: 5000
    outer_scale: 10
    outer_sigma: 0.0006715348489118068
    outer_positions_trainable: true
    outer_density_trainable: true
    outer_color_trainable: true
    corner_guards: false
    loss: smooth_l1
    smooth_l1_beta: 1
    opacity_weight: 1
    schedule: cosine
    sites_lr: 0.0002
    sites_final: 5.0e-06
    sites_steps: 18000
    density_lr: 0.1
    density_final: 0.01
    density_warmup: 2000
    density_steps: 20000
    color_lr: 0.005
    color_final: 0.0005
    color_steps: 20000
    adam_eps: 1.0e-15
    resolutions:
    - 4
    - 2
    - 1
    resolution_steps:
    - 0
    - 150
    - 500
    quantile_weight: 0
    quantile_start: 0
    quantile_ramp: 10000
    quantile_end: null
    fixed_quantiles: null
  overrides: {}
  inline:
    experiment_name: native-warmup
    output_dir: outputs/end_to_end/default/warmup
    seed: 0
    device: cuda
    representation_mode: voronoi_only
    background:
    - 0
    - 0
    - 0
    dataset:
      source_path: /shared/sets/datasets/foamsurf/lego/lego_both
      resolution: 1
      llffhold: 8
      gaussian_ground_truth_path: /shared/sets/datasets/foamsurf/lego/lego_lego
      medium_ground_truth_path: /shared/sets/datasets/foamsurf/lego/lego_clouds
      train_target: both
    model:
      medium_type: scalar
      appearance: rgb
      gaussian_rgb_activation: identity
      sh_degree: 3
      gaussian_initial_points: 1
      gaussian_initial_opacity: 0.1
      gaussian_initial_kappa: 1.01
      gaussian_initial_scale_neighbors: 1
      medium_points: 126072
      medium_guard_points: 0
      medium_guard_scale: 1.25
      medium_bbox_margin: 0.1
      medium_bbox_min:
      - -1.5
      - -1.5
      - -1.5
      medium_bbox_max:
      - 1.5
      - 1.5
      - 1.5
      medium_initial_density: 0.005
      medium_initial_color:
      - 0.5
      - 0.5
      - 0.5
    renderer:
      near: 0.1
      far: 1000
      training_transmittance_threshold: 0.0001
      validation_transmittance_threshold: 0.01
      max_intersections: 1024
      number_of_sides: 8
      gaussian_radius_squared: 11.3449
      gaussian_hit_buffer_size: 64
    optimization:
      iterations: 5000
      rays_per_batch: 1000000
      full_image_batch: true
      cameras_without_replacement: true
      reconstruction_loss: l1_dssim
      dssim_weight: 0.2
      gaussian_appearance_lr: 0.0025
      gaussian_appearance_rest_lr_scale: 0.05
      gaussian_appearance_lr_decay: 0
      gaussian_appearance_lr_final: null
      gaussian_opacity_lr: 0.025
      gaussian_opacity_lr_decay: 0
      gaussian_opacity_lr_final: null
      gaussian_kappa_lr: 0.1
      gaussian_kappa_lr_decay: 0
      gaussian_kappa_lr_final: null
      gaussian_means_lr: 0.00016
      gaussian_means_lr_decay: null
      gaussian_means_lr_final: 1.6e-06
      gaussian_means_lr_delay_steps: 0
      gaussian_means_lr_delay_mult: 0.01
      gaussian_means_lr_max_steps: 30000
      gaussian_means_spatial_scale: true
      gaussian_scales_lr: 0.005
      gaussian_scales_lr_decay: 0
      gaussian_scales_lr_final: null
      gaussian_quaternions_lr: 0.001
      gaussian_quaternions_lr_decay: 0
      gaussian_quaternions_lr_final: null
      gaussian_adam_eps: 1.0e-15
      gaussian_freeze_until: 0
      gaussian_sh_degree_interval: 1000
      gaussian_scale_regularization: 0
      gaussian_min_scale: null
      gaussian_max_scale_fraction: null
      medium_sites_lr: 5.0e-05
      medium_density_lr: 0.01
      medium_color_lr: 0.0025
      medium_sites_lr_final: null
      medium_density_lr_final: null
      medium_color_lr_final: null
      medium_lr_decay_from: 0
      medium_lr_decay_until: 5000
      topology_update_interval: 25
      topology_incremental: true
    validation:
      eval_interval: 500
      log_interval: 10
      checkpoint_interval: 500
      max_eval_views: -1
      image_views: 4
    diagnostics:
      enabled: true
      save_per_primitive: false
      contribution_epsilon: 1.0e-06
      layer_alpha_threshold: 0.01
    disentanglement:
      opacity_binarization_weight: 0
      opacity_binarization_start: 0
      opacity_binarization_ramp: 0
      opacity_binarization_ramp_shape: linear
      opacity_binarization_end: null
      opacity_binarization_end_ramp: 0
      opacity_binarization_end_ramp_shape: linear
      opacity_binarization_maintenance_scale: 1
    voronoi_warmup:
      enabled: true
      milestone_iterations:
      - 0
      - 500
      - 1000
      - 1999
      - 2000
      - 2500
      - 3000
      - 4000
      - 5000
    gaussian_adaptation:
      enabled: false
      policy: graphdeco
      max_points: 200000
      densify_from: 500
      densify_until: 15000
      densification_interval: 100
      gradient_threshold: 0.0002
      min_opacity: 0.005
      min_opacity_initial: null
      opacity_prune_from: 500
      opacity_prune_ramp: 0
      opacity_prune_ramp_shape: linear
      opacity_prune_until: null
      opacity_prune_interval: null
      min_points: 1
      max_opacity_prune_fraction: 1
      percent_dense: 0.01
      size_prune_from: 3000
      screen_pruning_enabled: false
      max_screen_size: 20
      max_world_scale_fraction: 0.1
      opacity_reset_interval: 0
      opacity_reset_value: 0.01
      opacity_reset_at_densify_from: false
      opacity_reset_optimizer_state: true
      medium_freeze_after_reset: 0
      medium_freeze_interval: 0
      medium_freeze_from: 0
      medium_freeze_steps: 0
      preserve_clone_opacity: false
      preserve_split_opacity: false
      runaway_max_points: null
      min_effective_scale: 1.0e-05
    voronoi_adaptation:
      enabled: true
      densify_from: 2000
      densify_until: 6001
      interval: 500
      adaptation_offset: 0
      densify_fraction: 0.02
      max_points: 2097152
      min_points: 4
      min_visibility: 1
      contribution_threshold: 1.0e-06
      gradient_threshold: 0
      prune_cell_radius_fraction: 0.02
      max_prune_fraction: 0.05
      prune_patience: 2
      child_jitter_fraction: 0.025
      freeze_at_capacity: false
    wandb:
      mode: offline
      project: foamsurf_end_to_end
      entity: null
      name: native-warmup
      tags:
      - voronoi-warmup
      - native-prior
      - lego-both
      - adaptive-population
partition:
  method: weighted_valley_w1_s2
  batch_size: 8192
  image_views: 4
handoff:
  gaussian_count: 100000
  pca_neighbors: 8
  reset_density: 1.0e-08
priors:
  config: seathru.yaml
  overrides:
  - joint.optimization.ocean_tri_weight=0.0
  - joint.optimization.ocean_epi_weight_start=0.0
  - joint.optimization.ocean_epi_weight_end=0.0
  - joint.optimization.ocean_res_weight=0.0
  - joint.optimization.ocean_alpha_until=0
  - joint.optimization.camera_isp=false
  - joint.optimization.water_phase=false
  - joint.optimization.water_extrapolation=false
  - joint.model.medium_initial_water_fit='off'
  - medium_fix.camera_water_weight=0.0
  - medium_fix.surface_coverage_weight=0.03  # as the reported runs (SeaThru's weight until 2026-11-08; 0.003 since)
