# Reproducible best 2D Gaussian baseline selected from sweep run gk_458910_17.
# Result on lego_lego: 37.1242 PSNR (seed 0, 30k iterations).
experiment_name: best-2d-gaussians
output_dir: outputs/baseline_best_2d_gaussians
seed: 0
device: cuda
representation_mode: gaussian_only
background: [0.0, 0.0, 0.0]

dataset:
  source_path: /shared/sets/datasets/foamsurf/lego/lego_both
  resolution: 1
  llffhold: 8
  gaussian_ground_truth_path: /shared/sets/datasets/foamsurf/lego/lego_lego
  medium_ground_truth_path: /shared/sets/datasets/foamsurf/lego/lego_clouds
  train_target: lego

model:
  appearance: rgb
  sh_degree: 3
  gaussian_initial_points: 100000
  gaussian_initial_opacity: 0.01
  gaussian_initial_kappa: 1.01
  gaussian_initial_scale_neighbors: 3
  medium_points: 32
  medium_guard_points: 0

renderer:
  near: 0.1
  far: 1000.0
  training_transmittance_threshold: 0.0001
  validation_transmittance_threshold: 0.01
  max_intersections: 1024
  number_of_sides: 8
  gaussian_radius_squared: 11.3449
  gaussian_hit_buffer_size: 64

optimization:
  iterations: 30000
  rays_per_batch: 640000
  full_image_batch: true
  cameras_without_replacement: true
  reconstruction_loss: l1_dssim
  dssim_weight: 0.2
  gaussian_appearance_lr: 0.005
  gaussian_appearance_rest_lr_scale: 1.0
  gaussian_appearance_lr_decay: -0.000086643
  gaussian_appearance_lr_final: 0.001
  gaussian_opacity_lr: 0.05
  gaussian_opacity_lr_decay: -0.000086643
  gaussian_opacity_lr_final: 0.025
  gaussian_kappa_lr: 0.1
  gaussian_kappa_lr_decay: -0.000086643
  gaussian_kappa_lr_final: 0.1
  gaussian_means_lr: 0.0025
  gaussian_means_lr_decay: -0.00015
  gaussian_means_lr_final: 0.000001189614075
  gaussian_means_lr_max_steps: 35000
  gaussian_means_spatial_scale: false
  gaussian_scales_lr: 0.0396538025
  gaussian_scales_lr_decay: -0.000086643
  gaussian_scales_lr_final: 0.0396538025
  gaussian_quaternions_lr: 0.01
  gaussian_quaternions_lr_decay: -0.000086643
  gaussian_quaternions_lr_final: 0.001
  gaussian_adam_eps: 0.00000001
  gaussian_sh_degree_interval: 0
  gaussian_scale_regularization: 0.001
  gaussian_min_scale: 0.0001
  gaussian_max_scale_fraction: 0.05

validation:
  eval_interval: 2000
  log_interval: 10
  checkpoint_interval: 2000
  max_eval_views: -1
  image_views: 1

diagnostics:
  enabled: true
  save_per_primitive: false

gaussian_adaptation:
  enabled: true
  policy: graphdeco
  max_points: null
  runaway_max_points: null
  densify_from: 500
  densify_until: 15000
  densification_interval: 250
  gradient_threshold: 0.0004
  min_opacity: 0.01
  opacity_prune_from: 500
  percent_dense: 0.02
  size_prune_from: 3000
  screen_pruning_enabled: false
  max_world_scale_fraction: 0.10
  opacity_reset_interval: 0
  opacity_reset_value: 0.01
  opacity_reset_at_densify_from: false
  opacity_reset_optimizer_state: true

voronoi_adaptation:
  enabled: false

wandb:
  mode: online
  project: foamsurf_best_2d_gaussians
  name: best-2d-gaussians-k64-graphdeco-noreset
  tags: [baseline, best-2d-gaussians, lego-lego, k64, graphdeco, no-opacity-reset]
