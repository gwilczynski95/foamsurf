# FoamSurf on the synthetic Blender scenes: an object inside a volumetric cloud (/shared/sets/datasets/foamsurf/
# {lego,ficus}/*_both), with the object alone (lego_lego, ficus_object) and the cloud alone (*_clouds) as layer
# ground truth. configs/seathru.yaml changed only where the data forces it:
#   - Blender scenes have no COLMAP tracks, so the medium is not fitted on them: every cell starts at
#     joint.model.medium_initial_density (nearly clear);
#   - the seabed coverage prior keeps weight 0.03 (configs/seathru.yaml has 0.003 since 2026-11-08), as the
#     synthetic runs were trained;
#   - Gaussians start from 100k random points in the object box [-1.3, 1.3]^3 (the 3DGS convention for these
#     scenes), and the medium sites are placed around that box and the cameras (configs/seathru.yaml rule).
# Layer metrics (lego_lego/*, lego_clouds/* in eval.csv): pass the sibling scenes, e.g.
#   python train.py --config configs/synthetic.yaml --scene $D/lego/lego_both --out outputs/lego \
#     --set joint.dataset.gaussian_ground_truth_path=$D/lego/lego_lego \
#     --set joint.dataset.medium_ground_truth_path=$D/lego/lego_clouds
base_config: seathru.yaml
overrides:
  - joint.model.medium_initial_water_fit='off'   # quoted: bare off is YAML for false
  - medium_fix.surface_coverage_weight=0.03      # the reported synthetic runs (SeaThru's weight until 2026-11-08)
