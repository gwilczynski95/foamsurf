# Current SeaThru default (2026-11-05): test PSNR (seeds 42 and 43, sweep 561669) IUI3 31.85, Curacao 34.32,
# JG 24.31, Panama 32.55, mean 30.76 (WaterSplatting + PPISP 30.71, OceanSplat paper 30.71). It is the
# 2026-10-30 default below plus, at the end of the list: opacity cull/reset as WaterSplatting (_cull05r),
# opacity binarisation (_bin01), the water phase function (_wphase), Gaussian colour 1.5 x sigmoid (_rgbs15)
# and, at evaluation, the water light continued beyond the training directions (_wext).
# The 2026-10-30 default: OceanSplat + PPISP + homogeneous water at the cameras + Mip filter +
# water attenuation fitted on the COLMAP tracks, 20k iterations = configs/iui3_default.yaml plus:
# - Gaussian scale at most 5% of the scene (_clamp05);
# - medium colour initialised from the training photos (_minit);
# - resolution schedule 1/4 -> 1/2 -> full (_rs);
# - WaterSplatting / OceanSplat loss: L1 and D-SSIM divided by the detached prediction (_rel);
# - OceanSplat trinocular consistency, epipolar depth, residual and depth-aware opacity (_oceane), on every
#   2nd step with weight x2 (_oe2);
# - PPISP camera model (_isp; Deutsch et al., CVPR 2026): per-photo exposure and colour, shared vignetting
#   and response curve; test views with the exposure and colour of their 4 nearest training photos;
# - free-water cells near the training cameras pulled to the median water (_camw, weight 0.01);
# - Mip-Splatting 3D filter (_mip);
# - medium attenuation and backscatter of every cell started from the fit on the COLMAP point tracks (_wfit);
# - 20k iterations with every schedule scaled by 2/3 (_it20k; schedule.iterations, training/schedule.py).
# Test PSNR of that 2026-10-30 default (mean of seeds 42 and 43, neighbour exposure; run _wfit of sweep 553596,
# evaluated at 1e-2): IUI3 31.47, Curacao 33.82, JG 24.23, Panama 31.94, mean 30.36 (30.42 with _vt).
# Earlier defaults: without _wfit 30.22 (552797); without _camw, _oe2, _mip, _it20k 29.95 dB in 53 min
# (551590). configs/iui3_default.yaml stays the base of the older sweep suffixes; tests/test_camera_isp.py
# checks that this file equals it plus the suffixes above.
base_config: iui3_5k.yaml
output_dir: outputs/seathru_default/run
gaussian_rgb_activation: sigmoid
medium_color_activation: sigmoid
wandb_project: foamsurf_iui3_medium_color
overrides:
  # configs/iui3_default.yaml
  - medium_fix.chroma_weight=1.0
  - medium_fix.chroma_alpha_threshold=0.02
  - medium_fix.surface_coverage_weight=3.0e-3
  - medium_fix.surface_coverage_threshold=0.9
  - medium_fix.water_clear_weight=1.0e-2
  - joint.gaussian_adaptation.gradient_threshold=0.0002
  - joint.gaussian_adaptation.max_points=700000
  - joint.gaussian_adaptation.gradient_attenuation_compensation=true
  - joint.model.appearance=sh
  - joint.model.sh_degree=3
  - joint.optimization.gaussian_sh_degree_interval=1000
  - warmup.background=[0.0, 0.0, 0.0]
  - joint.background=[0.0, 0.0, 0.0]
  # _clamp05
  - joint.optimization.gaussian_max_scale_scene_fraction=0.05
  # _minit
  - joint.model.medium_initial_color_from_data=true
  # _rs
  - joint.optimization.training_downscale_levels=2
  - joint.optimization.training_downscale_interval=6000
  # _rel
  - joint.optimization.reconstruction_loss=reg_l1_reg_dssim
  # _oceane
  - joint.optimization.ocean_tri_weight=0.1
  - joint.optimization.ocean_epi_weight_start=0.4
  - joint.optimization.ocean_epi_weight_end=0.2
  - joint.optimization.ocean_res_weight=0.01
  - joint.optimization.ocean_alpha_until=12000
  - joint.optimization.ocean_from=4000
  # _isp
  - joint.optimization.camera_isp=true
  - joint.optimization.camera_isp_neighbours=4
  # _camw
  - medium_fix.camera_water_weight=0.01
  # _oe2
  - joint.optimization.ocean_every=2
  # _it20k (applied after all overrides)
  - schedule.iterations=20000
  # _mip
  - joint.model.gaussian_mip_filter=0.2
  # _wfit
  - joint.model.medium_initial_water_fit=coefficients
  # _vt (2026-11-01): evaluation rays end at the training transmittance threshold 1e-4 instead of 1e-2
  # (+0.07 dB on 553596 seed 42 without retraining: the model is fitted with the longer rays)
  - joint.renderer.validation_transmittance_threshold=1.0e-4
  # _cull05r (2026-11-02): opacity prune at 0.5 while densifying, reset to 0.5 every 750 (30k terms), as
  # WaterSplatting (+0.08 dB)
  - joint.gaussian_adaptation.min_opacity=0.5
  - joint.gaussian_adaptation.min_opacity_initial=0.5
  - joint.gaussian_adaptation.opacity_prune_ramp=0
  - joint.gaussian_adaptation.min_opacity_late=0.1
  - joint.gaussian_adaptation.min_opacity_late_from=15000
  - joint.gaussian_adaptation.max_opacity_prune_fraction=1.0
  - joint.gaussian_adaptation.opacity_reset_interval=750
  - joint.gaussian_adaptation.opacity_reset_value=0.5
  # _bin01: opacity binarisation x10 (+0.08 dB)
  - joint.disentanglement.opacity_binarization_weight=0.01
  # _wphase: Henyey-Greenstein phase function on the backscatter (training/water_phase.py; +0.04 dB)
  - joint.optimization.water_phase=true
  # _rgbs15 (2026-11-05): Gaussian colour = 1.5 x sigmoid, white objects behind water reach the photo
  - joint.model.gaussian_rgb_scale=1.5
  # _wext: evaluation only, water light continued beyond the training directions (training/water_extrapolation.py)
  - joint.optimization.water_extrapolation=true
