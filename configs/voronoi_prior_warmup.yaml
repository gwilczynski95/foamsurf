# Native FoamSurf replacement for the external RadFoam pretraining stage.
# It deliberately learns the complete lego_both image with Voronoi only.
experiment_name: voronoi-prior-warmup
output_dir: outputs/voronoi_prior_warmup/default
seed: 0
device: cuda
representation_mode: voronoi_only
background: [0.0, 0.0, 0.0]

dataset:
  source_path: /shared/sets/datasets/foamsurf/lego/lego_both
  resolution: 1
  llffhold: 8
  gaussian_ground_truth_path: /shared/sets/datasets/foamsurf/lego/lego_lego
  medium_ground_truth_path: /shared/sets/datasets/foamsurf/lego/lego_clouds
  train_target: both

model:
  appearance: rgb
  sh_degree: 3
  # The model schema requires a Gaussian population, but voronoi_only keeps
  # this single placeholder frozen and excludes it from every render.
  gaussian_initial_points: 1
  gaussian_initial_opacity: 0.10
  gaussian_initial_kappa: 1.01
  gaussian_initial_scale_neighbors: 1
  # This is an initial population, not a fixed final count.
  medium_points: 350000
  medium_guard_points: 0
  medium_guard_scale: 1.25
  medium_bbox_margin: 0.10
  medium_bbox_min: [-1.5, -1.5, -1.5]
  medium_bbox_max: [1.5, 1.5, 1.5]
  medium_initial_density: 0.005
  medium_initial_color: [0.5, 0.5, 0.5]

voronoi_warmup:
  enabled: true
  milestone_iterations: [0, 500, 1000, 2000, 3000, 4000, 5000]

renderer:
  near: 0.1
  far: 1000.0
  training_transmittance_threshold: 0.0001
  validation_transmittance_threshold: 0.01
  max_intersections: 1024
  number_of_sides: 8
  gaussian_radius_squared: 11.3449
  gaussian_hit_buffer_size: 64

optimization:
  iterations: 5000
  rays_per_batch: 640000
  full_image_batch: true
  cameras_without_replacement: true
  reconstruction_loss: l1_dssim
  dssim_weight: 0.2
  medium_sites_lr: 0.00005
  medium_density_lr: 0.01
  medium_color_lr: 0.0025
  medium_sites_lr_final: null
  medium_density_lr_final: null
  medium_color_lr_final: null
  medium_lr_decay_from: 0
  medium_lr_decay_until: 5000
  topology_update_interval: 25
  topology_incremental: true

validation:
  eval_interval: 500
  log_interval: 10
  checkpoint_interval: 500
  max_eval_views: -1
  image_views: 4

diagnostics:
  enabled: true
  save_per_primitive: false
  contribution_epsilon: 0.000001
  layer_alpha_threshold: 0.01

disentanglement:
  opacity_binarization_weight: 0.0
  opaque_if_used_weight: 0.0
  graph_tv_weight: 0.0
  density_cap_weight: 0.0
  optical_thickness_weight: 0.0

medium_handoff:
  prefix_mode: none
  prefix_iterations: 0

radfoam_prior:
  enabled: false

gaussian_adaptation:
  enabled: false

# Population size is learned. The wide safety range lets empty/redundant
# regions shrink while high-error regions split, without making 350k a target.
voronoi_adaptation:
  enabled: true
  densify_from: 500
  densify_until: 5001
  interval: 500
  adaptation_offset: 0
  densify_fraction: 0.02
  max_points: 500000
  min_points: 100000
  min_visibility: 1.0
  contribution_threshold: 0.000001
  gradient_threshold: 0.0
  prune_cell_radius_fraction: 0.02
  max_prune_fraction: 0.05
  prune_patience: 2
  child_jitter_fraction: 0.025
  freeze_at_capacity: false

wandb:
  mode: online
  project: foamsurf_voronoi_prior_warmup
  name: voronoi-prior-warmup-seed0
  tags: [voronoi-warmup, native-prior, lego-both, adaptive-population]
